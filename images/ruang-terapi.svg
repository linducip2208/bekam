<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#a7f3d0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f4"/>
      <stop offset="100%" style="stop-color:#e7e5e4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <!-- Wall -->
  <rect x="40" y="60" width="520" height="400" rx="16" fill="url(#wall)"/>
  <!-- Floor -->
  <rect x="40" y="420" width="520" height="140" rx="0" fill="#d6d3d1"/>
  <line x1="40" y1="420" x2="560" y2="420" stroke="#a8a29e" stroke-width="2"/>
  <!-- Bed -->
  <rect x="140" y="300" width="320" height="100" rx="14" fill="#fef3c7"/>
  <rect x="140" y="300" width="320" height="100" rx="14" fill="#e5e7eb" opacity="0.5"/>
  <rect x="160" y="305" width="280" height="90" rx="10" fill="#fefce8"/>
  <rect x="170" y="355" width="260" height="6" rx="3" fill="#d4a574" opacity="0.3"/>
  <!-- Pillow -->
  <rect x="180" y="260" width="100" height="40" rx="20" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <!-- Bed legs -->
  <rect x="160" y="400" width="10" height="25" rx="3" fill="#a8a29e"/>
  <rect x="430" y="400" width="10" height="25" rx="3" fill="#a8a29e"/>
  <!-- Curtain left -->
  <path d="M50 70 Q80 200 70 400 L50 400 Z" fill="#ecfccb" opacity="0.6"/>
  <path d="M80 70 Q110 200 100 400 L80 400 Z" fill="#d9f99d" opacity="0.4"/>
  <!-- Curtain right -->
  <path d="M550 70 Q520 200 530 400 L550 400 Z" fill="#ecfccb" opacity="0.6"/>
  <path d="M520 70 Q490 200 500 400 L520 400 Z" fill="#d9f99d" opacity="0.4"/>
  <!-- Window -->
  <rect x="240" y="90" width="120" height="140" rx="8" fill="#bae6fd" stroke="#d4d4d8" stroke-width="3"/>
  <line x1="300" y1="90" x2="300" y2="230" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="240" y1="160" x2="360" y2="160" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Sunlight through window -->
  <polygon points="240,230 360,230 420,400 180,400" fill="#fef3c7" opacity="0.15"/>
  <!-- Privacy lock icon -->
  <circle cx="460" cy="200" r="28" fill="#047857"/>
  <text x="460" y="208" text-anchor="middle" font-size="28" fill="white">&#128274;</text>
  <!-- Title -->
  <text x="300" y="510" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#064e3b">Ruang Terapi Privat</text>
  <text x="300" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#047857">Satu Ruang · Satu Pasien</text>
  <!-- Decorative -->
  <circle cx="90" cy="500" r="50" fill="#059669" opacity="0.06"/>
</svg>
