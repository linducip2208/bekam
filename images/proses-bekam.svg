<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)"/>
  <!-- Person silhouette - back view (modest) -->
  <ellipse cx="300" cy="520" rx="100" ry="15" fill="#d4a574" opacity="0.4"/>
  <!-- Body covered with cloth -->
  <rect x="200" y="220" width="200" height="280" rx="40" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <!-- Cloth drape -->
  <path d="M200 250 Q300 200 400 250" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <path d="M190 300 Q300 260 410 300" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <!-- Shoulders exposed area -->
  <ellipse cx="300" cy="230" rx="90" ry="40" fill="#fcd34d" opacity="0.25"/>
  <!-- Cupping marks on back -->
  <circle cx="260" cy="350" r="16" fill="#f87171" opacity="0.5"/>
  <circle cx="260" cy="350" r="12" fill="#fca5a5" opacity="0.6"/>
  <circle cx="340" cy="350" r="16" fill="#f87171" opacity="0.5"/>
  <circle cx="340" cy="350" r="12" fill="#fca5a5" opacity="0.6"/>
  <circle cx="300" cy="300" r="14" fill="#f87171" opacity="0.5"/>
  <circle cx="300" cy="300" r="10" fill="#fca5a5" opacity="0.6"/>
  <circle cx="260" cy="400" r="14" fill="#f87171" opacity="0.4"/>
  <circle cx="340" cy="400" r="14" fill="#f87171" opacity="0.4"/>
  <!-- Cup being applied -->
  <rect x="375" y="335" width="30" height="35" rx="8" fill="#047857" opacity="0.7"/>
  <ellipse cx="390" cy="335" rx="15" ry="5" fill="#34d399" opacity="0.5"/>
  <!-- Terapis hands (modest - just hands) -->
  <ellipse cx="395" cy="390" rx="18" ry="10" fill="#d4a574" opacity="0.5"/>
  <ellipse cx="210" cy="370" rx="18" ry="10" fill="#d4a574" opacity="0.5"/>
  <!-- Hijab indication -->
  <path d="M240 200 Q300 170 360 200" fill="#34d399" opacity="0.4"/>
  <text x="300" y="508" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#78350f">Proses Bekam</text>
  <text x="300" y="538" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#92400e">Lembut · Sesuai Sunnah</text>
</svg>
