<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ccfbf1"/>
      <stop offset="100%" style="stop-color:#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg8)"/>
  <!-- Building -->
  <rect x="180" y="200" width="240" height="260" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>
  <!-- Roof -->
  <polygon points="180,200 300,120 420,200" fill="#047857" stroke="#064e3b" stroke-width="2"/>
  <!-- Door -->
  <rect x="270" y="350" width="60" height="110" rx="6" fill="#d4a574" stroke="#b08560" stroke-width="2"/>
  <circle cx="320" cy="410" r="4" fill="#78716c"/>
  <!-- Windows -->
  <rect x="210" y="240" width="45" height="45" rx="4" fill="#bae6fd" stroke="#059669" stroke-width="1.5"/>
  <line x1="232" y1="240" x2="232" y2="285" stroke="#059669" stroke-width="1"/>
  <line x1="210" y1="262" x2="255" y2="262" stroke="#059669" stroke-width="1"/>
  <rect x="345" y="240" width="45" height="45" rx="4" fill="#bae6fd" stroke="#059669" stroke-width="1.5"/>
  <line x1="367" y1="240" x2="367" y2="285" stroke="#059669" stroke-width="1"/>
  <line x1="345" y1="262" x2="390" y2="262" stroke="#059669" stroke-width="1"/>
  <!-- Sign -->
  <rect x="200" y="175" width="200" height="40" rx="8" fill="#059669"/>
  <text x="300" y="201" text-anchor="middle" font-size="18" font-weight="700" fill="white">BekamAkhwat</text>
  <!-- Crescent moon -->
  <circle cx="260" cy="135" r="16" fill="none" stroke="#d4a574" stroke-width="3"/>
  <circle cx="266" cy="131" r="12" fill="#ccfbf1"/>
  <!-- Location pin -->
  <path d="M450 470 Q450 440 440 440 Q430 440 430 470 Q440 490 450 470 Z" fill="#ef4444"/>
  <circle cx="440" cy="465" r="5" fill="white"/>
  <!-- Trees -->
  <circle cx="140" cy="380" r="35" fill="#4ade80" opacity="0.5"/>
  <rect x="137" y="415" width="6" height="30" rx="2" fill="#78716c"/>
  <circle cx="480" cy="370" r="40" fill="#22c55e" opacity="0.4"/>
  <rect x="477" y="410" width="6" height="35" rx="2" fill="#78716c"/>
  <!-- Path/walkway -->
  <rect x="270" y="460" width="60" height="60" rx="4" fill="#d6d3d1" opacity="0.4"/>
  <!-- Title -->
  <text x="300" y="555" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#064e3b">Klinik BekamAkhwat</text>
  <text x="300" y="580" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#047857">Tanjung Priok · Jakarta Utara</text>
</svg>
