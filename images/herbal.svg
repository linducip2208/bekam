<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg7)"/>
  <!-- Honey jar -->
  <rect x="250" y="240" width="100" height="130" rx="16" fill="#fbbf24" opacity="0.6"/>
  <rect x="250" y="240" width="100" height="130" rx="16" fill="none" stroke="#d97706" stroke-width="3"/>
  <rect x="265" y="220" width="70" height="28" rx="6" fill="#92400e"/>
  <rect x="270" y="200" width="60" height="24" rx="4" fill="#b45309"/>
  <!-- Label on jar -->
  <rect x="270" y="270" width="60" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="300" y="297" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">MADU</text>
  <text x="300" y="312" text-anchor="middle" font-size="10" fill="#b45309">Murni</text>
  <!-- Honey drips -->
  <path d="M290 220 Q285 230 290 235" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Dipper -->
  <line x1="345" y1="180" x2="325" y2="300" stroke="#a8a29e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="310" r="18" fill="none" stroke="#a8a29e" stroke-width="4"/>
  <!-- Herbal leaves on the side -->
  <ellipse cx="180" cy="350" rx="30" ry="12" fill="#4ade80" transform="rotate(-20 180 350)"/>
  <line x1="180" y1="350" x2="180" y2="338" stroke="#166534" stroke-width="2"/>
  <ellipse cx="195" cy="340" rx="25" ry="10" fill="#22c55e" transform="rotate(10 195 340)"/>
  <line x1="195" y1="340" x2="195" y2="330" stroke="#166534" stroke-width="1.5"/>
  <ellipse cx="400" cy="370" rx="28" ry="10" fill="#a3e635" transform="rotate(-15 400 370)"/>
  <line x1="400" y1="370" x2="400" y2="360" stroke="#4d7c0f" stroke-width="2"/>
  <ellipse cx="420" cy="360" rx="22" ry="9" fill="#84cc16" transform="rotate(25 420 360)"/>
  <!-- Small herb bottle -->
  <rect x="400" y="280" width="35" height="50" rx="6" fill="#fcd34d" opacity="0.5" stroke="#d97706" stroke-width="2"/>
  <rect x="405" y="272" width="25" height="14" rx="3" fill="#b45309"/>
  <text x="417" y="305" text-anchor="middle" font-size="9" fill="#92400e" font-weight="600">HERBAL</text>
  <!-- Title -->
  <text x="300" y="510" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#7c2d12">Madu & Herbal</text>
  <text x="300" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#9a3412">Dukungan Pasca Bekam</text>
</svg>
