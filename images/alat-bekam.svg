  <ellipse cx="180" cy="420" rx="45" ry="12" fill="#047857" opacity="0.5"/>
  <path d="M135 420 Q135 300 165 280 L195 280 Q225 300 225 420" fill="url(#cup)" stroke="#047857" stroke-width="2"/>
  <ellipse cx="180" cy="280" rx="30" ry="8" fill="url(#glass)"/>
  <ellipse cx="180" cy="280" rx="12" ry="4" fill="#34d399" opacity="0.5"/>
  <ellipse cx="300" cy="420" rx="50" ry="14" fill="#047857" opacity="0.5"/>
  <path d="M250 420 Q250 280 280 255 L320 255 Q350 280 350 420" fill="url(#cup)" stroke="#047857" stroke-width="2"/>
  <ellipse cx="300" cy="255" rx="35" ry="10" fill="url(#glass)"/>
  <ellipse cx="300" cy="255" rx="14" ry="5" fill="#34d399" opacity="0.5"/>
  <ellipse cx="420" cy="420" rx="40" ry="11" fill="#047857" opacity="0.5"/>
  <path d="M380 420 Q380 310 405 292 L435 292 Q460 310 460 420" fill="url(#cup)" stroke="#047857" stroke-width="2"/>
  <ellipse cx="420" cy="292" rx="27" ry="7" fill="url(#glass)"/>
  <ellipse cx="420" cy="292" rx="10" ry="3" fill="#34d399" opacity="0.5"/>
  <!-- Pump -->
  <rect x="350" y="440" width="80" height="22" rx="11" fill="#78716c"/>
  <rect x="360" y="448" width="60" height="6" rx="3" fill="#a8a29e"/>
  <rect x="380" y="435" width="20" height="5" rx="2" fill="#57534e"/>
  <line x1="390" y1="435" x2="390" y2="420" stroke="#78716c" stroke-width="3"/>
  <!-- Lancet/pen -->
  <rect x="460" y="380" width="6" height="60" rx="3" fill="#d4d4d8"/>
  <rect x="461" y="375" width="4" height="10" rx="2" fill="#a1a1aa"/>
  <polygon points="463,375 459,360 467,360" fill="#f87171"/>
  <!-- Title -->
  <text x="300" y="510" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#064e3b">Alat Bekam Steril</text>
  <text x="300" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#047857">Disposable · Sekali Pakai</text>
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="40" fill="#059669" opacity="0.08"/>
  <circle cx="520" cy="120" r="60" fill="#059669" opacity="0.06"/>
  <circle cx="500" cy="500" r="30" fill="#d4a574" opacity="0.1"/>
