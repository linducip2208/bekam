  <!-- Title -->
  <text x="300" y="545" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#4c1d95">Ruqyah Syar'iyyah</text>
  <text x="300" y="572" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#6d28d9">Bacaan Al-Qur'an & Doa Sunnah</text>
