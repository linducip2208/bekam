name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            mirror --reverse --delete --parallel=5 \
              --exclude .git/ \
              --exclude .github/ \
              --exclude .gitignore \
              --exclude pseo-data.json \
              --exclude generate-pseo.ps1 \
              ./ ${{ secrets.FTP_DIR }}/
            quit
          " -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
