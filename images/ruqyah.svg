  <line x1="315" y1="348" x2="428" y2="348" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
  <!-- Book stand -->
  <line x1="260" y1="440" x2="240" y2="480" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
